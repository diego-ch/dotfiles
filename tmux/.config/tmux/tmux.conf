######################
# keybinds
######################
bind r source-file ~/.config/tmux/tmux.conf

# rebind split windows
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# clear default split binds
unbind '"'
unbind '%'

######################
# mouse support
######################
set -g mouse on

######################
# shell
######################
set-option -g default-shell $SHELL
set -g default-terminal 'tmux-256color'
set -g set-titles on

######################
# window and panes
######################
set -g base-index 1
set -g pane-base-index 1
set -g pane-border-lines double
set -g renumber-windows on

setw -g pane-base-index 1
setw -g automatic-rename on

######################
# overrides
######################
set-option -sa terminal-overrides ',*:RGB'
set-option -sa terminal-features ',xterm-256color:clipboard'

######################
# plugins
######################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "arcticicestudio/nord-tmux"

# keep plugins outside the dotfiles repo: tpm otherwise defaults to
# ~/.config/tmux/plugins, which stow may fold into the repo itself
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
